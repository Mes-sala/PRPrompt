<text x="85" y="1195" font-family="STHeiti, PingFang SC, sans-serif" font-size="29" fill="#26354b" text-anchor="start">训练结束后的读出｜M3 使用适配表示，不向 token 或主干反传</text>
<rect x="90" y="1220" width="330" height="155" rx="18" fill="#ffffff" stroke="#80b28d" stroke-width="2"/>
<text x="255.0" y="1266" font-family="STHeiti, PingFang SC, sans-serif" font-size="28" fill="#26354b" text-anchor="middle">共同中心化</text>
<text x="255.0" y="1302" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">Z 减去全图均值</text>
<text x="255.0" y="1336" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">按节点归一化</text>
<rect x="500" y="1220" width="340" height="155" rx="18" fill="#ffffff" stroke="#80b28d" stroke-width="2"/>
<text x="670.0" y="1266" font-family="STHeiti, PingFang SC, sans-serif" font-size="28" fill="#26354b" text-anchor="middle">两项并行准备</text>
<text x="670.0" y="1302" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">支持原型 → 初始概率 F₀</text>
<text x="670.0" y="1336" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">余弦相似度 → 50 近邻 W</text>
<rect x="920" y="1220" width="380" height="155" rx="18" fill="#ffffff" stroke="#80b28d" stroke-width="2"/>
<text x="1110.0" y="1266" font-family="STHeiti, PingFang SC, sans-serif" font-size="28" fill="#26354b" text-anchor="middle">M3：支持约束传播</text>
<text x="1110.0" y="1302" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">0.1 F₀ + 0.9 W F，20 次</text>
<text x="1110.0" y="1336" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">初始化及每步固定支持标签</text>
<rect x="1380" y="1220" width="330" height="155" rx="18" fill="#ffffff" stroke="#80b28d" stroke-width="2"/>
<text x="1545.0" y="1266" font-family="STHeiti, PingFang SC, sans-serif" font-size="28" fill="#26354b" text-anchor="middle">输出预测</text>
<text x="1545.0" y="1302" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">log 概率 / argmax</text>
<text x="1545.0" y="1336" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">封存后才用查询标签评分</text>
