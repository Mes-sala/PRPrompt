<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1550" viewBox="0 0 1800 1550"><rect width="100%" height="100%" fill="#f5f7fb"/>
<text x="60" y="74" font-family="STHeiti, PingFang SC, sans-serif" font-size="39" fill="#26354b" text-anchor="start">三模块图提示适配：同一冻结主干上的生成、优化与读出</text>
<text x="60" y="118" font-family="STHeiti, PingFang SC, sans-serif" font-size="25" fill="#5b6d84" text-anchor="start">实线：前向数据流    橙色虚线：训练梯度与参数更新    只有类别 token P 可学习</text>
<rect x="60" y="150" width="1680" height="105" rx="18" fill="#eaf0fa" stroke="#d6deea" stroke-width="2"/>
<text x="900.0" y="196" font-family="STHeiti, PingFang SC, sans-serif" font-size="28" fill="#26354b" text-anchor="middle">输入：节点属性 X、原图边 E、支持节点 S 及其标签</text>
<text x="900.0" y="232" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">全图属性和结构可见；查询节点的真实标签不进入教师、训练或概率传播</text>
<rect x="60" y="305" width="460" height="750" rx="18" fill="#e8f4f5" stroke="#d6deea" stroke-width="2"/>
<text x="290.0" y="352" font-family="STHeiti, PingFang SC, sans-serif" font-size="29" fill="#26354b" text-anchor="middle">M1｜语义条件与门控锐化</text>
<rect x="610" y="305" width="580" height="750" rx="18" fill="#eaf0fa" stroke="#d6deea" stroke-width="2"/>
<text x="900.0" y="352" font-family="STHeiti, PingFang SC, sans-serif" font-size="29" fill="#26354b" text-anchor="middle">共享的冻结两层 GCN</text>
<rect x="1280" y="305" width="460" height="750" rx="18" fill="#fff0e2" stroke="#d6deea" stroke-width="2"/>
<text x="1510.0" y="352" font-family="STHeiti, PingFang SC, sans-serif" font-size="29" fill="#26354b" text-anchor="middle">M2｜方向与尺度匹配</text>
<rect x="90" y="395" width="400" height="135" rx="18" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
<text x="290.0" y="441" font-family="STHeiti, PingFang SC, sans-serif" font-size="28" fill="#26354b" text-anchor="middle">属性准备</text>
<text x="290.0" y="477" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">原图两跳传播 → 全图中心化</text>
<text x="290.0" y="511" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">节点向量归一化</text>
<rect x="90" y="575" width="400" height="150" rx="18" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
<text x="290.0" y="621" font-family="STHeiti, PingFang SC, sans-serif" font-size="28" fill="#26354b" text-anchor="middle">支持原型 → 修正教师</text>
<text x="290.0" y="657" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">支持原型 + 无标签软原型</text>
<text x="290.0" y="691" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">混合比例 0.5；修正 3 次</text>
<rect x="90" y="775" width="400" height="170" rx="18" fill="#ffffff" stroke="#52a7ae" stroke-width="2"/>
<text x="290.0" y="821" font-family="STHeiti, PingFang SC, sans-serif" font-size="28" fill="#26354b" text-anchor="middle">门控 Q（训练期间固定）</text>
<text x="290.0" y="857" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">类别概率温度 0.2 → 0.1</text>
<text x="290.0" y="891" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">按类别中心化 → 原图传播</text>
<text x="290.0" y="925" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">输出：N × C 的门控系数</text>
<rect x="650" y="395" width="500" height="120" rx="18" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
<text x="900.0" y="441" font-family="STHeiti, PingFang SC, sans-serif" font-size="28" fill="#26354b" text-anchor="middle">冻结 GCN 第一层</text>
<text x="900.0" y="477" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">输出预激活 U；计算各维标准差</text>
<rect x="650" y="590" width="500" height="165" rx="18" fill="#ffffff" stroke="#7d91d7" stroke-width="2"/>
<text x="900.0" y="636" font-family="STHeiti, PingFang SC, sans-serif" font-size="28" fill="#26354b" text-anchor="middle">提示注入与激活</text>
<text x="900.0" y="672" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">ΔU = 10 · [Q tanh(P)] · std(U)</text>
<text x="900.0" y="706" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">P：C × 128，零初始化</text>
<text x="900.0" y="740" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">H = LeakyReLU(U + ΔU)</text>
<rect x="650" y="805" width="500" height="105" rx="18" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
<text x="900.0" y="851" font-family="STHeiti, PingFang SC, sans-serif" font-size="28" fill="#26354b" text-anchor="middle">冻结 GCN 第二层</text>
<text x="900.0" y="887" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">利用原图 E 得到适配表示 Z</text>
<rect x="650" y="960" width="500" height="75" rx="18" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
<text x="900.0" y="1006" font-family="STHeiti, PingFang SC, sans-serif" font-size="28" fill="#26354b" text-anchor="middle">最终更新后重新前向</text>
<rect x="1310" y="395" width="400" height="165" rx="18" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
<text x="1510.0" y="441" font-family="STHeiti, PingFang SC, sans-serif" font-size="28" fill="#26354b" text-anchor="middle">支持集训练损失</text>
<text x="1510.0" y="477" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">留一原型交叉熵</text>
<text x="1510.0" y="511" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">+ 0.001 × token 均方值</text>
<text x="1510.0" y="545" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">只使用支持标签</text>
<rect x="1310" y="595" width="400" height="120" rx="18" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
<text x="1510.0" y="641" font-family="STHeiti, PingFang SC, sans-serif" font-size="28" fill="#26354b" text-anchor="middle">token 梯度 G</text>
<text x="1510.0" y="677" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">左右矩阵统计 → Shampoo方向</text>
<rect x="1310" y="785" width="400" height="165" rx="18" fill="#ffffff" stroke="#d79654" stroke-width="2"/>
<text x="1510.0" y="831" font-family="STHeiti, PingFang SC, sans-serif" font-size="28" fill="#26354b" text-anchor="middle">尺度匹配并更新 P</text>
<text x="1510.0" y="867" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">同轨迹 Adam 候选方向的范数</text>
<text x="1510.0" y="901" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">匹配矩阵方向范数；学习率 0.01</text>
<text x="1510.0" y="935" font-family="STHeiti, PingFang SC, sans-serif" font-size="23" fill="#26354b" text-anchor="middle">重复 100 次，只更新 P</text>
