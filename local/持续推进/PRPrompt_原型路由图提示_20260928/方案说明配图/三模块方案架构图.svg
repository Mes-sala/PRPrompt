<text x="60" y="1467" font-family="STHeiti, PingFang SC, sans-serif" font-size="27" fill="#26354b" text-anchor="start">两种关系图：原图用于 GCN 与门控传播；适配表示的近邻图仅用于最终概率读出。</text>
<text x="60" y="1515" font-family="STHeiti, PingFang SC, sans-serif" font-size="25" fill="#5b6d84" text-anchor="start">M1 调整 token 的使用方式，M2 学习这些 token，M3 利用所得表示；不是三个独立模型的投票。</text>
