[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prprompt-research"
version = "3.0.0"
description = "Input prototype-routed prompts for few-shot node and graph classification"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "torch-geometric>=2.5", "numpy>=1.24", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
include = ["prprompt*"]
